name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 */3 * *' 
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase with Node.js
        run: |
          node -e "
          fetch('https://lhpbkbfiicwevrpoyqa.supabase.co/rest/v1/wake_up_supabase', {
            method: 'POST',
            headers: {
              'apikey': 'sb_publishable_m_hDTKTRyZJ2JEccgQciP0_q4WlNdAo',
              'Authorization': 'Bearer sb_publishable_m_hDTKTRyZJ2JEccgQciP0_q4WlNdAo',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ value: 'alive' })
          })
          .then(res => {
            if (res.ok) console.log('Success:', res.status);
            else { console.error('Error:', res.status); process.exit(1); }
          })
          .catch(err => { console.error(err); process.exit(1); });
          "
